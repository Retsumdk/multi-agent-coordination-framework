name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (src + tests)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Demo smoke test (two runs must be identical)
        run: |
          bun run demo > /tmp/demo-1.json
          bun run demo > /tmp/demo-2.json
          diff /tmp/demo-1.json /tmp/demo-2.json

      - name: Script runner smoke test
        run: node dist/cli-run.js run --script examples/scenario.json
